[package]
name = "mushaf-desktop"
version = "0.2.1"
description = "The Madinah Mushaf on your desktop, opened by your coding agents while they work."
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "mushaf_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "mushaf-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
mushaf-agents.workspace = true
mushaf-engine.workspace = true
mushaf-ipc.workspace = true
mushaf-protocol.workspace = true
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["fs", "time"] }

[dev-dependencies]
tempfile = "3"
